<script>
  // localStorage-backed shim matching the window.storage.get/set async interface
  window.storage = {
    get: async function (key) {
      try {
        var value = window.localStorage.getItem(key);
        return value !== null ? { key: key, value: value } : null;
      } catch (e) {
        return null;
      }
    },
    set: async function (key, value) {
      try {
        window.localStorage.setItem(key, value);
        return { key: key, value: value };
      } catch (e) {
        return null;
      }
    },
  };
</script>

const AVATAR_COLORS = ["#7c3aed", "#e11d48", "#d97706", "#059669", "#2563eb", "#db2777"];
const avatarColor = (seed) => {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = seed.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
};

function computeStats(tasks, xp) {
  const done = tasks.filter((t) => t.done && t.completedAt);
  const totalDone = done.length;
  const level = Math.floor(xp / 100) + 1;

  const byDay = {};
  done.forEach((t) => {
    const k = dayKey(t.completedAt);
    byDay[k] = (byDay[k] || 0) + 1;
  });
  const maxInDay = Object.values(byDay).length ? Math.max(...Object.values(byDay)) : 0;
  const nightOwl = done.some((t) => new Date(t.completedAt).getHours() >= 22);
  const onTime = done.some((t) => t.alarmTime && t.completedAt < t.alarmTime);
  const usedSubtasks = tasks.some((t) => (t.subtasks || []).length > 0);

  let streak = 0;
  let cursor = new Date();
  const todayKey = dayKey(cursor.getTime());
  if (!byDay[todayKey]) cursor.setDate(cursor.getDate() - 1);
  while (byDay[dayKey(cursor.getTime())]) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  return { totalDone, level, maxInDay, nightOwl, onTime, usedSubtasks, streak, byDay };
}

function formatAlarm(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const isTomorrow = d.toDateString() === tomorrow.toDateString();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (isToday) return time;
  if (isTomorrow) return `Tmrw ${time}`;
  return `${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
}

function nextOccurrence(ts, repeat) {
  const d = new Date(ts);
  if (repeat === "daily") d.setDate(d.getDate() + 1);
  if (repeat === "weekly") d.setDate(d.getDate() + 7);
  return d.getTime();
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  } catch (e) {}
}

/* ---------- Confetti ---------- */
function Confetti({ trigger }) {
  if (!trigger) return null;
  const pieces = Array.from({ length: 16 });
  const colors = ["#7c3aed", "#e11d48", "#d97706", "#18181b"];
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 50, overflow: "hidden" }}>
      {pieces.map((_, i) => {
        const left = 10 + Math.random() * 80;
        const delay = Math.random() * 0.15;
        const dur = 0.7 + Math.random() * 0.5;
        const color = colors[i % colors.length];
        return <span key={`${trigger}-${i}`} style={{ position: "absolute", top: "38%", left: `${left}%`, width: 6, height: 6, background: color, borderRadius: i % 2 ? "50%" : 0, animation: `confetti-fall ${dur}s ease-out ${delay}s forwards` }} />;
      })}
    </div>
  );
}

/* ---------- Heatmap ---------- */
function Heatmap({ byDay }) {
  const weeks = 12;
  const cells = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks * 7 - 1));
  start.setDate(start.getDate() - start.getDay());
  for (let w = 0; w < weeks; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(start);
      date.setDate(start.getDate() + w * 7 + d);
      const k = dayKey(date.getTime());
      col.push({ k, count: byDay[k] || 0, future: date > today });
    }
    cells.push(col);
  }
  const shade = (count) => (count === 0 ? "#f4f4f5" : count === 1 ? "#c4b5fd" : count <= 3 ? "#a78bfa" : count <= 5 ? "#8b5cf6" : "#6d28d9");
  return (
    <div style={{ display: "flex", gap: 3, overflowX: "auto", paddingBottom: 4 }}>
      {cells.map((col, i) => (
        <div key={i} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
          {col.map((c, j) => (
            <div key={j} title={`${c.k}: ${c.count} done`} style={{ width: 9, height: 9, background: c.future ? "transparent" : shade(c.count), border: c.future ? "1px solid #f4f4f5" : "none" }} />
          ))}
        </div>
      ))}
    </div>
  );
}

/* ---------- Odometer countdown ---------- */
function OdometerDigit({ char }) {
  const prevRef = useRef(char);
  const tickRef = useRef(0);
  if (prevRef.current !== char) {
    tickRef.current += 1;
    prevRef.current = char;
  }
  const isColon = char === ":";
  return (
    <div style={{ width: isColon ? 18 : 38, height: 56, overflow: "hidden", position: "relative" }}>
      <span
        key={tickRef.current}
        style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 46, fontWeight: 700, fontFamily: "'Courier New', monospace", color: "#fef3c7",
          animation: "digit-roll 0.4s cubic-bezier(0.3, 0.9, 0.4, 1)",
          textShadow: "0 0 18px rgba(251,191,36,0.5)",
        }}
      >
        {char}
      </span>
    </div>
  );
}

function Odometer({ seconds }) {
  const mm = Math.floor(seconds / 60).toString().padStart(2, "0");
  const ss = Math.floor(seconds % 60).toString().padStart(2, "0");
  const text = `${mm}:${ss}`;
  return (
    <div style={{ display: "flex", justifyContent: "center" }}>
      {text.split("").map((c, i) => <OdometerDigit key={i} char={c} />)}
      <style>{`@keyframes digit-roll { 0% { transform: translateY(-60%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }`}</style>
    </div>
  );
}

/* ---------- Focus Mode (the candle) ---------- */
function FocusMode({ task, totalSeconds, onExit, onComplete }) {
  const [remaining, setRemaining] = useState(totalSeconds);
  const [finished, setFinished] = useState(false);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (paused || finished) return;
    if (remaining <= 0) {
      setFinished(true);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.3, 0.6].forEach((delay) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 660;
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + delay + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.9);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 1);
        });
      } catch (e) {}
      return;
    }
    const iv = setTimeout(() => setRemaining((r) => r - 1), 1000);
    return () => clearTimeout(iv);
  }, [remaining, paused, finished]);

  const fraction = Math.max(0, remaining / totalSeconds);
  const waxHeight = 20 + fraction * 150;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "radial-gradient(circle at 50% 30%, #2a1810 0%, #120a08 55%, #050303 100%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, animation: "focus-in 0.4s ease" }}>
      <button onClick={onExit} style={{ position: "absolute", top: 24, right: 24, background: "rgba(255,255,255,0.08)", border: "none", color: "#d4d4d8", padding: 8, borderRadius: 8, cursor: "pointer" }}>
        <X size={18} />
      </button>

      <p style={{ color: "#a1a1aa", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", fontFamily: "monospace", margin: "0 0 6px" }}>
        {finished ? "session complete" : "focusing on"}
      </p>
      <h2 style={{ color: "#fef3c7", fontSize: 18, fontWeight: 600, margin: "0 0 36px", textAlign: "center", maxWidth: 320 }}>{task.text}</h2>

      {/* Candle */}
      <div style={{ position: "relative", width: 90, height: 220, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", marginBottom: 40 }}>
        {!finished && (
          <div
            style={{
              width: 22, height: 32, marginBottom: -4,
              background: "radial-gradient(circle at 50% 35%, #fff9db 0%, #fbbf24 35%, #f59e0b 65%, transparent 75%)",
              borderRadius: "50% 50% 50% 50% / 65% 65% 35% 35%",
              filter: "blur(0.3px)",
              boxShadow: "0 0 30px 8px rgba(251,191,36,0.45)",
              animation: "flicker 1.6s ease-in-out infinite",
              transformOrigin: "bottom center",
            }}
          />
        )}
        {finished && (
          <div style={{ position: "relative", marginBottom: 4, height: 20 }}>
            {[0, 1, 2].map((i) => (
              <div key={i} style={{ position: "absolute", bottom: 0, left: i * 6 - 6, width: 6, height: 6, borderRadius: "50%", background: "rgba(200,200,200,0.4)", animation: `smoke 1.6s ease-out ${i * 0.3}s infinite` }} />
            ))}
          </div>
        )}
        <div style={{ width: 56, height: waxHeight, background: "linear-gradient(180deg, #fffbeb 0%, #fde68a 40%, #fbbf24 100%)", borderRadius: "6px 6px 3px 3px", transition: "height 1s linear", boxShadow: "inset -6px 0 10px rgba(180,120,20,0.25)" }} />
        <div style={{ width: 74, height: 14, background: "#3f3f46", borderRadius: 3, marginTop: -1 }} />
      </div>

      {!finished ? (
        <>
          <Odometer seconds={remaining} />
          <div style={{ display: "flex", gap: 10, marginTop: 36 }}>
            <button className="tappable" onClick={() => setPaused((p) => !p)} style={{ background: "rgba(255,255,255,0.1)", color: "#fef3c7", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              {paused ? "Resume" : "Pause"}
            </button>
            <button className="tappable" onClick={onExit} style={{ background: "transparent", color: "#a1a1aa", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              End early
            </button>
          </div>
        </>
      ) : (
        <div style={{ textAlign: "center", animation: "fade-up 0.5s ease" }}>
          <p style={{ color: "#d4d4d8", fontSize: 13, marginBottom: 20 }}>The candle burned all the way down.</p>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <button className="tappable" onClick={onComplete} style={{ background: "#7c3aed", color: "#fff", border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              Mark task done
            </button>
            <button className="tappable" onClick={onExit} style={{ background: "transparent", color: "#a1a1aa", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "11px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              Back to tasks
            </button>
          </div>
        </div>
      )}

      <style>{`
        @keyframes focus-in { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes flicker {
          0%, 100% { transform: scale(1) skewX(0deg); }
          25% { transform: scale(1.05, 0.96) skewX(-2deg); }
          50% { transform: scale(0.95, 1.05) skewX(2deg); }
          75% { transform: scale(1.03, 0.98) skewX(-1deg); }
        }
        @keyframes smoke {
          0% { opacity: 0.5; transform: translateY(0) scale(1); }
          100% { opacity: 0; transform: translateY(-40px) scale(2); }
        }
        @keyframes fade-up { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
      `}</style>
    </div>
  );
}

/* ---------- Task Row ---------- */
function TaskRow({ t, onToggle, onDelete, onOpen, onFocus, popped, assigneeMember, showAssignee }) {
  const p = PRIORITIES[t.priority] || PRIORITIES.important;
  const Icon = p.icon;
  const overdue = t.alarmTime && !t.done && t.alarmTime < Date.now();
  const isUrgent = t.priority === "urgent";
  const subtasks = t.subtasks || [];
  const subDone = subtasks.filter((s) => s.done).length;

  const cardBg = t.done ? "#f0fdf4" : isUrgent ? "rgba(225,29,72,0.035)" : "#ffffff";
  const cardBorder = t.done ? "#bbf7d0" : isUrgent ? "#fecdd3" : "#e4e4e7";

  return (
    <div
      className="tappable"
      onClick={() => onOpen(t.id)}
      style={{
        display: "flex", alignItems: "center", gap: 10,
        border: `1px solid ${cardBorder}`,
        borderLeft: isUrgent && !t.done ? "3px solid #e11d48" : `1px solid ${cardBorder}`,
        borderRadius: 10,
        padding: "12px 10px",
        marginBottom: 8,
        cursor: "pointer",
        animation: "task-in 0.28s ease",
        background: cardBg,
        boxShadow: "0 1px 2px rgba(0,0,0,0.02)",
      }}
    >
      <button
        onClick={(e) => { e.stopPropagation(); onToggle(t.id); }}
        style={{ width: 20, height: 20, borderRadius: "50%", border: t.done ? "none" : "1.5px solid #d4d4d8", background: t.done ? "#16a34a" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, padding: 0, animation: popped ? "check-pop 0.3s ease" : "none" }}
      >
        {t.done && <Check size={12} color="#fff" strokeWidth={3} />}
      </button>

      <div style={{ flex: 1, minWidth: 0 }}>
        <span style={{ fontSize: 14, fontWeight: t.done ? 400 : 500, textDecoration: t.done ? "line-through" : "none", color: t.done ? "#86929c" : "#18181b" }}>{t.text}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
          {showAssignee && (
            assigneeMember ? (
              <div title={assigneeMember.name} style={{ display: "flex", alignItems: "center", gap: 3 }}>
                <div style={{ width: 13, height: 13, borderRadius: "50%", background: avatarColor(assigneeMember.name || assigneeMember.email), color: "#fff", fontSize: 7, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{initials(assigneeMember.name || assigneeMember.email)}</div>
                <span style={{ fontSize: 10, color: "#a1a1aa" }}>{assigneeMember.name}</span>
              </div>
            ) : (
              <div title="Visible to everyone in this workspace" style={{ display: "flex", alignItems: "center", gap: 3 }}>
                <Globe2 size={10} color="#a1a1aa" />
                <span style={{ fontSize: 10, color: "#a1a1aa" }}>Everyone</span>
              </div>
            )
          )}
          {t.alarmTime && (
            <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
              {t.reminderProvider === "google" ? (
                <CalendarDays size={10} color={overdue ? "#e11d48" : "#a1a1aa"} />
              ) : (
                <Clock size={10} color={overdue ? "#e11d48" : "#a1a1aa"} style={overdue ? { animation: "pulse-dot 1s ease infinite" } : undefined} />
              )}
              <span style={{ fontSize: 10, color: overdue ? "#e11d48" : "#a1a1aa", fontFamily: "monospace", fontWeight: overdue ? 700 : 400 }}>{overdue ? "OVERDUE" : formatAlarm(t.alarmTime)}</span>
            </div>
          )}
          {subtasks.length > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
              <ListChecks size={10} color="#a1a1aa" />
              <span style={{ fontSize: 10, color: "#a1a1aa", fontFamily: "monospace" }}>{subDone}/{subtasks.length}</span>
            </div>
          )}
          {t.repeat && t.repeat !== "none" && <Repeat size={10} color="#a1a1aa" />}
          {(t.tags || []).slice(0, 2).map((tag) => (
            <span key={tag} style={{ fontSize: 9, color: "#7c3aed", background: "#f5f3ff", padding: "1px 6px", borderRadius: 4, fontFamily: "monospace" }}>#{tag}</span>
          ))}
        </div>
      </div>

      <div title={p.label} style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
        <Icon size={12} color={p.color} />
      </div>
      {!t.done && (
        <button
          onClick={(e) => { e.stopPropagation(); onFocus(t); }}
          title="Start focus session"
          style={{ background: "transparent", border: "none", color: "#f59e0b", cursor: "pointer", padding: 4, display: "flex", flexShrink: 0 }}
        >
          <Flame size={14} />
        </button>
      )}
      <ChevronRight size={14} color="#d4d4d8" style={{ flexShrink: 0 }} />
      <button
        onClick={(e) => { e.stopPropagation(); onDelete(t.id); }}
        style={{ background: "transparent", border: "none", color: "#d4d4d8", cursor: "pointer", padding: 4, display: "flex", flexShrink: 0 }}
      >
        <Trash2 size={14} />
      </button>
      <style>{`@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
    </div>
  );
}

/* ---------- Task Detail Drawer ---------- */
function TaskDetailDrawer({ task, projects, onClose, onUpdate, onDelete, onFocus, members, isTeamWorkspace, googleConnected }) {
  const [tagInput, setTagInput] = useState("");
  const [subInput, setSubInput] = useState("");
  const [alarmPickerOpen, setAlarmPickerOpen] = useState(false);

  if (!task) return null;
  const p = PRIORITIES[task.priority] || PRIORITIES.important;

  const addTag = () => {
    if (!tagInput.trim()) return;
    onUpdate(task.id, { tags: [...(task.tags || []), tagInput.trim().replace(/^#/, "")] });
    setTagInput("");
  };
  const removeTag = (tag) => onUpdate(task.id, { tags: (task.tags || []).filter((t) => t !== tag) });

  const addSubtask = () => {
    if (!subInput.trim()) return;
    onUpdate(task.id, { subtasks: [...(task.subtasks || []), { id: uid("s"), text: subInput.trim(), done: false }] });
    setSubInput("");
  };
  const toggleSub = (subId) => onUpdate(task.id, { subtasks: (task.subtasks || []).map((s) => (s.id === subId ? { ...s, done: !s.done } : s)) });
  const deleteSub = (subId) => onUpdate(task.id, { subtasks: (task.subtasks || []).filter((s) => s.id !== subId) });

  const setQuickAlarm = (mins) => onUpdate(task.id, { alarmTime: Date.now() + mins * 60000, alarmFired: false });
  const setTonight = () => { const d = new Date(); d.setHours(20, 0, 0, 0); if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1); onUpdate(task.id, { alarmTime: d.getTime(), alarmFired: false }); };
  const setTomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); onUpdate(task.id, { alarmTime: d.getTime(), alarmFired: false }); };

  return (
    <>
      <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(24,24,27,0.35)", zIndex: 74 }} />
      <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(400px, 92vw)", background: "#ffffff", zIndex: 75, transform: "translateX(0)", animation: "drawer-in 0.32s cubic-bezier(0.22, 1, 0.36, 1)", boxShadow: "-8px 0 30px rgba(0,0,0,0.1)", overflowY: "auto", padding: "20px 20px 60px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <button onClick={onClose} style={{ display: "flex", alignItems: "center", gap: 4, background: "transparent", border: "none", cursor: "pointer", color: "#71717a", fontSize: 12, fontWeight: 600, padding: 4 }}>
            <ChevronLeft size={16} /> Back
          </button>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            {!task.done && (
              <button onClick={() => { onFocus(task); onClose(); }} title="Start focus session" style={{ display: "flex", alignItems: "center", gap: 5, background: "transparent", border: "1px solid #fde68a", borderRadius: 8, cursor: "pointer", color: "#b45309", padding: "6px 10px", fontSize: 11, fontWeight: 700 }}>
                <Flame size={13} /> Focus
              </button>
            )}
            <button onClick={() => { onDelete(task.id); onClose(); }} style={{ background: "transparent", border: "none", cursor: "pointer", color: "#e11d48", padding: 4 }}><Trash2 size={16} /></button>
          </div>
        </div>

        {/* Title */}
        <textarea
          value={task.text}
          onChange={(e) => onUpdate(task.id, { text: e.target.value })}
          rows={2}
          style={{ width: "100%", border: "none", outline: "none", fontSize: 19, fontWeight: 700, resize: "none", fontFamily: "inherit", boxSizing: "border-box", marginBottom: 14, color: task.done ? "#a1a1aa" : "#18181b", textDecoration: task.done ? "line-through" : "none" }}
        />

        {/* Priority */}
        <div style={{ display: "flex", marginBottom: 16, border: "1px solid #e4e4e7" }}>
          {Object.entries(PRIORITIES).map(([key, pr], i) => {
            const Icon = pr.icon;
            return (
              <button key={key} onClick={() => onUpdate(task.id, { priority: key })} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 5, flex: 1, fontSize: 12, fontWeight: 600, padding: "9px 6px", border: "none", borderRight: i < 2 ? "1px solid #e4e4e7" : "none", background: task.priority === key ? "#18181b" : "transparent", color: task.priority === key ? "#fff" : "#71717a", cursor: "pointer" }}>
                <Icon size={12} color={task.priority === key ? pr.color : "#a1a1aa"} />{pr.label}
              </button>
            );
          })}
        </div>

        {/* Project */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "block", marginBottom: 6 }}>PROJECT</label>
          <select
            value={task.projectId || ""}
            onChange={(e) => onUpdate(task.id, { projectId: e.target.value || null })}
            style={{ width: "100%", border: "1px solid #e4e4e7", padding: "9px 10px", fontSize: 13, background: "#fff", fontFamily: "inherit" }}
          >
            <option value="">Inbox</option>
            {projects.map((pr) => (<option key={pr.id} value={pr.id}>{pr.name}</option>))}
          </select>
        </div>

        {isTeamWorkspace && (
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}><Users size={11} /> ASSIGNED TO</label>
            <select
              value={task.assigneeId || ""}
              onChange={(e) => onUpdate(task.id, { assigneeId: e.target.value || null })}
              style={{ width: "100%", border: "1px solid #e4e4e7", padding: "9px 10px", fontSize: 13, background: "#fff", fontFamily: "inherit" }}
            >
              <option value="">Everyone (visible to whole workspace)</option>
              {(members || []).map((m) => (<option key={m.id} value={m.id}>{m.name}{m.id === "me" ? " (you)" : ""}</option>))}
            </select>
            <p style={{ fontSize: 11, color: "#a1a1aa", marginTop: 6, lineHeight: 1.4 }}>
              {task.assigneeId ? "Only this person and workspace admins can see this task." : "Everyone in this workspace can see this task."}
            </p>
          </div>
        )}

        {/* Alarm */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "block", marginBottom: 6 }}>REMINDER</label>
          <div style={{ border: "1px solid #e4e4e7" }}>
            {googleConnected && task.alarmTime && (
              <div style={{ display: "flex", borderBottom: "1px solid #f4f4f5" }}>
                <button onClick={() => onUpdate(task.id, { reminderProvider: "default" })} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 11, fontWeight: 700, padding: "8px 6px", border: "none", borderRight: "1px solid #f4f4f5", background: (task.reminderProvider || "default") === "default" ? "#18181b" : "transparent", color: (task.reminderProvider || "default") === "default" ? "#fff" : "#71717a", cursor: "pointer" }}>
                  <Bell size={11} /> Flow reminder
                </button>
                <button onClick={() => onUpdate(task.id, { reminderProvider: "google" })} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 11, fontWeight: 700, padding: "8px 6px", border: "none", background: task.reminderProvider === "google" ? "#18181b" : "transparent", color: task.reminderProvider === "google" ? "#fff" : "#71717a", cursor: "pointer" }}>
                  <CalendarDays size={11} /> Google Calendar
                </button>
              </div>
            )}
            <button onClick={() => setAlarmPickerOpen(!alarmPickerOpen)} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", border: "none", background: "transparent", padding: "10px 12px", fontSize: 12, color: task.alarmTime ? "#7c3aed" : "#a1a1aa", cursor: "pointer", fontWeight: task.alarmTime ? 700 : 400 }}>
              {task.alarmTime && task.reminderProvider === "google" ? <CalendarDays size={13} /> : <Clock size={13} />}
              {task.alarmTime ? formatAlarm(task.alarmTime) : "No reminder set"}
            </button>
            {alarmPickerOpen && (
              <div style={{ padding: "0 12px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  <button onClick={() => setQuickAlarm(60)} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>In 1h</button>
                  <button onClick={() => setQuickAlarm(180)} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>In 3h</button>
                  <button onClick={setTonight} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>Tonight 8pm</button>
                  <button onClick={setTomorrow} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>Tmrw 9am</button>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input type="datetime-local" onChange={(e) => onUpdate(task.id, { alarmTime: new Date(e.target.value).getTime(), alarmFired: false })} style={{ flex: 1, fontSize: 12, border: "1px solid #e4e4e7", padding: "6px 8px" }} />
                  {task.alarmTime && <button onClick={() => onUpdate(task.id, { alarmTime: null })} style={{ fontSize: 11, color: "#e11d48", background: "transparent", border: "1px solid #e4e4e7", padding: "0 10px", cursor: "pointer" }}>Clear</button>}
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Repeat */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "block", marginBottom: 6 }}>REPEAT</label>
          <div style={{ display: "flex", border: "1px solid #e4e4e7" }}>
            {["none", "daily", "weekly"].map((r, i) => (
              <button key={r} onClick={() => onUpdate(task.id, { repeat: r })} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 12, fontWeight: 600, padding: "9px 6px", border: "none", borderRight: i < 2 ? "1px solid #e4e4e7" : "none", background: (task.repeat || "none") === r ? "#18181b" : "transparent", color: (task.repeat || "none") === r ? "#fff" : "#71717a", cursor: "pointer", textTransform: "capitalize" }}>
                {r !== "none" && <Repeat size={11} />} {r}
              </button>
            ))}
          </div>
        </div>

        {/* Notes */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}><FileText size={11} /> NOTES</label>
          <textarea
            value={task.notes || ""}
            onChange={(e) => onUpdate(task.id, { notes: e.target.value })}
            placeholder="Add context, links, details…"
            rows={3}
            style={{ width: "100%", border: "1px solid #e4e4e7", padding: "10px 12px", fontSize: 13, resize: "vertical", fontFamily: "inherit", boxSizing: "border-box" }}
          />
        </div>

        {/* Subtasks */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}><ListChecks size={11} /> SUBTASKS</label>
          <div style={{ border: "1px solid #e4e4e7" }}>
            {(task.subtasks || []).map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderBottom: "1px solid #f4f4f5" }}>
                <button onClick={() => toggleSub(s.id)} style={{ width: 15, height: 15, border: s.done ? "none" : "1.5px solid #d4d4d8", background: s.done ? "#18181b" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, padding: 0 }}>
                  {s.done && <Check size={9} color="#fff" />}
                </button>
                <span style={{ flex: 1, fontSize: 12.5, textDecoration: s.done ? "line-through" : "none", color: s.done ? "#a1a1aa" : "#18181b" }}>{s.text}</span>
                <button onClick={() => deleteSub(s.id)} style={{ background: "transparent", border: "none", color: "#d4d4d8", cursor: "pointer", padding: 2 }}><X size={12} /></button>
              </div>
            ))}
            <div style={{ display: "flex" }}>
              <input value={subInput} onChange={(e) => setSubInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSubtask()} placeholder="Add a subtask…" style={{ flex: 1, border: "none", outline: "none", padding: "9px 10px", fontSize: 12.5, fontFamily: "inherit" }} />
              <button onClick={addSubtask} style={{ border: "none", background: "transparent", color: "#7c3aed", padding: "0 10px", cursor: "pointer" }}><Plus size={15} /></button>
            </div>
          </div>
        </div>

        {/* Tags */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}><TagIcon size={11} /> TAGS</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
            {(task.tags || []).map((tag) => (
              <span key={tag} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: "#7c3aed", background: "#f5f3ff", padding: "4px 8px" }}>
                #{tag} <X size={10} style={{ cursor: "pointer" }} onClick={() => removeTag(tag)} />
              </span>
            ))}
          </div>
          <div style={{ display: "flex", border: "1px solid #e4e4e7" }}>
            <input value={tagInput} onChange={(e) => setTagInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTag()} placeholder="Add a tag…" style={{ flex: 1, border: "none", outline: "none", padding: "9px 10px", fontSize: 12.5, fontFamily: "inherit" }} />
            <button onClick={addTag} style={{ border: "none", background: "transparent", color: "#7c3aed", padding: "0 10px", cursor: "pointer" }}><Plus size={15} /></button>
          </div>
        </div>

        {/* Meta */}
        <div style={{ fontSize: 10, color: "#a1a1aa", fontFamily: "monospace", borderTop: "1px solid #f4f4f5", paddingTop: 12 }}>
          CREATED {new Date(task.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}
          {task.completedAt && <div style={{ marginTop: 3 }}>COMPLETED {new Date(task.completedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</div>}
        </div>
      </div>
      <style>{`@keyframes drawer-in { 0% { transform: translateX(100%); } 100% { transform: translateX(0); } }`}</style>
    </>
  );
}

/* ---------- Main ---------- */
function TaskTracker() {
  const [entered, setEntered] = useState(false);
  const [tasks, setTasks] = useState([]);
  const [projects, setProjects] = useState([]);
  const [activeProjectId, setActiveProjectId] = useState("inbox");
  const [xp, setXp] = useState(0);
  const [unlocked, setUnlocked] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [input, setInput] = useState("");
  const [priority, setPriority] = useState("important");
  const [filter, setFilter] = useState("active");
  const [confettiKey, setConfettiKey] = useState(0);
  const [xpToast, setXpToast] = useState(null);
  const [achievementToast, setAchievementToast] = useState(null);
  const [insightsOpen, setInsightsOpen] = useState(false);
  const [poppedId, setPoppedId] = useState(null);
  const [somedayOpen, setSomedayOpen] = useState(false);
  const [alarmPickerOpen, setAlarmPickerOpen] = useState(false);
  const [alarmTime, setAlarmTime] = useState(null);
  const [customTime, setCustomTime] = useState("");
  const [reminderProvider, setReminderProvider] = useState("default");
  const [newProjectOpen, setNewProjectOpen] = useState(false);
  const [newProjectName, setNewProjectName] = useState("");
  const [ringingTask, setRingingTask] = useState(null);
  const [selectedTaskId, setSelectedTaskId] = useState(null);
  const [focusPickerTask, setFocusPickerTask] = useState(null);
  const [focusSession, setFocusSession] = useState(null);
  const [workspaces, setWorkspaces] = useState(defaultWorkspaces());
  const [activeWorkspaceId, setActiveWorkspaceId] = useState("personal");
  const [profile, setProfile] = useState({ name: "You", email: "" });
  const [googleConnected, setGoogleConnected] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [assigneeId, setAssigneeId] = useState("");
  const [viewAsMemberId, setViewAsMemberId] = useState(null);
  const toastTimer = useRef(null);
  const achTimer = useRef(null);
  const popTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("flow-data-v4");
        if (res?.value) {
          const parsed = JSON.parse(res.value);
          setTasks((parsed.tasks || []).map((t) => ({ ...t, priority: migratePriority(t.priority), notes: t.notes || "", subtasks: t.subtasks || [], tags: t.tags || [], repeat: t.repeat || "none", workspaceId: t.workspaceId || "personal", assigneeId: t.assigneeId || null, reminderProvider: t.reminderProvider || "default" })));
          setProjects((parsed.projects || []).map((p) => ({ ...p, workspaceId: p.workspaceId || "personal" })));
          setXp(parsed.xp || 0);
          setUnlocked(parsed.unlocked || []);
          setWorkspaces(parsed.workspaces || defaultWorkspaces());
          setActiveWorkspaceId(parsed.activeWorkspaceId || "personal");
          setProfile(parsed.profile || { name: "You", email: "" });
          setGoogleConnected(!!parsed.googleConnected);
        } else {
          // migrate from older v3 store if present
          const old = await window.storage.get("flow-data-v3").catch(() => null);
          if (old?.value) {
            const parsed = JSON.parse(old.value);
            setTasks((parsed.tasks || []).map((t) => ({ ...t, priority: migratePriority(t.priority), notes: t.notes || "", subtasks: t.subtasks || [], tags: t.tags || [], repeat: t.repeat || "none", workspaceId: "personal", assigneeId: null, reminderProvider: "default" })));
            setProjects((parsed.projects || []).map((p) => ({ ...p, workspaceId: "personal" })));
            setXp(parsed.xp || 0);
            setUnlocked(parsed.unlocked || []);
          }
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("flow-data-v4", JSON.stringify({ tasks, projects, xp, unlocked, workspaces, activeWorkspaceId, profile, googleConnected })).catch(() => {});
  }, [tasks, projects, xp, unlocked, workspaces, activeWorkspaceId, profile, googleConnected, loaded]);

  useEffect(() => {
    const iv = setInterval(() => {
      if (ringingTask) return;
      const due = tasks.find((t) => t.alarmTime && !t.alarmFired && !t.done && t.alarmTime <= Date.now());
      if (due) {
        setTasks((prev) => prev.map((t) => (t.id === due.id ? { ...t, alarmFired: true } : t)));
        setRingingTask(due);
        beep();
      }
    }, 1000);
    return () => clearInterval(iv);
  }, [tasks, ringingTask]);

  const stats = computeStats(tasks, xp);
  const levelProgress = xp % 100;

  const checkAchievements = (newStats) => {
    const newlyUnlocked = ACHIEVEMENTS.filter((a) => !unlocked.includes(a.id) && a.check(newStats));
    if (newlyUnlocked.length) {
      setUnlocked((prev) => [...prev, ...newlyUnlocked.map((a) => a.id)]);
      clearTimeout(achTimer.current);
      setAchievementToast(newlyUnlocked[0]);
      achTimer.current = setTimeout(() => setAchievementToast(null), 3200);
    }
  };

  const addTask = () => {
    if (!input.trim()) return;
    setTasks([
      { id: uid(), text: input.trim(), priority, done: false, createdAt: Date.now(), completedAt: null, projectId: activeProjectId === "inbox" ? null : activeProjectId, workspaceId: activeWorkspaceId, assigneeId: assigneeId || null, alarmTime, alarmFired: false, reminderProvider, notes: "", subtasks: [], tags: [], repeat: "none" },
      ...tasks,
    ]);
    setInput("");
    setAlarmTime(null);
    setAlarmPickerOpen(false);
    setCustomTime("");
    setReminderProvider("default");
    setAssigneeId("");
  };

  const updateTask = (id, patch) => setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));

  const toggleTask = (id) => {
    const target = tasks.find((t) => t.id === id);
    const willComplete = target && !target.done;
    let updated = tasks.map((t) => (t.id === id ? { ...t, done: !t.done, completedAt: !t.done ? Date.now() : null } : t));

    if (willComplete && target.repeat && target.repeat !== "none") {
      const clone = { ...target, id: uid(), done: false, completedAt: null, alarmFired: false, subtasks: (target.subtasks || []).map((s) => ({ ...s, done: false })), alarmTime: target.alarmTime ? nextOccurrence(target.alarmTime, target.repeat) : null };
      updated = [clone, ...updated];
    }

    setTasks(updated);
    clearTimeout(popTimer.current);
    setPoppedId(id);
    popTimer.current = setTimeout(() => setPoppedId(null), 320);

    if (willComplete) {
      const gained = PRIORITIES[target.priority].xp;
      const newXp = xp + gained;
      setXp(newXp);
      setConfettiKey((k) => k + 1);
      clearTimeout(toastTimer.current);
      setXpToast(`+${gained} XP`);
      toastTimer.current = setTimeout(() => setXpToast(null), 1200);
      checkAchievements(computeStats(updated, newXp));
    }
  };

  const deleteTask = (id) => setTasks((prev) => prev.filter((t) => t.id !== id));

  const addProject = () => {
    if (!newProjectName.trim()) return;
    const id = uid("p_");
    setProjects([...projects, { id, name: newProjectName.trim(), notes: "", workspaceId: activeWorkspaceId }]);
    setActiveProjectId(id);
    setNewProjectName("");
    setNewProjectOpen(false);
  };
  const updateProjectNotes = (id, notes) => setProjects(projects.map((p) => (p.id === id ? { ...p, notes } : p)));

  const setQuickAlarm = (mins) => setAlarmTime(Date.now() + mins * 60000);
  const setTonightAlarm = () => { const d = new Date(); d.setHours(20, 0, 0, 0); if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1); setAlarmTime(d.getTime()); };
  const setTomorrowAlarm = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); setAlarmTime(d.getTime()); };

  const switchWorkspace = (id) => {
    setActiveWorkspaceId(id);
    setActiveProjectId("inbox");
    setViewAsMemberId(null);
  };
  const createWorkspace = (name) => {
    const id = uid("w_");
    setWorkspaces([...workspaces, { id, name, type: "team", members: [{ id: "me", name: profile.name || "You", email: profile.email, role: "admin", status: "active" }] }]);
    switchWorkspace(id);
  };
  const inviteMember = (email, role) => {
    setWorkspaces((prev) => prev.map((w) => (w.id === activeWorkspaceId ? { ...w, members: [...w.members, { id: uid("u_"), name: email.split("@")[0], email, role, status: "pending" }] } : w)));
  };
  const removeMember = (memberId) => {
    setWorkspaces((prev) => prev.map((w) => (w.id === activeWorkspaceId ? { ...w, members: w.members.filter((m) => m.id !== memberId) } : w)));
    setTasks((prev) => prev.map((t) => (t.workspaceId === activeWorkspaceId && t.assigneeId === memberId ? { ...t, assigneeId: null } : t)));
  };
  const changeRole = (memberId, role) => {
    setWorkspaces((prev) => prev.map((w) => (w.id === activeWorkspaceId ? { ...w, members: w.members.map((m) => (m.id === memberId ? { ...m, role } : m)) } : w)));
  };

  const activeWorkspace = workspaces.find((w) => w.id === activeWorkspaceId) || workspaces[0];
  const isTeamWorkspace = activeWorkspace.type === "team";
  const workspaceMembers = activeWorkspace.members || [];

  const workspaceProjects = projects.filter((p) => p.workspaceId === activeWorkspaceId);
  const workspaceTasksRaw = tasks.filter((t) => (t.workspaceId || "personal") === activeWorkspaceId);
  const visibilityFilteredTasks = isTeamWorkspace
    ? workspaceTasksRaw.filter((t) => !viewAsMemberId || !t.assigneeId || t.assigneeId === viewAsMemberId)
    : workspaceTasksRaw;

  const projectTasks = visibilityFilteredTasks.filter((t) => (activeProjectId === "inbox" ? !t.projectId : t.projectId === activeProjectId));
  const visibleTasks = projectTasks.filter((t) => (filter === "all" ? true : filter === "active" ? !t.done : t.done));
  const mainTasks = visibleTasks.filter((t) => t.priority !== "someday").sort((a, b) => (a.priority === "urgent" ? -1 : 1) - (b.priority === "urgent" ? -1 : 1));
  const somedayTasks = visibleTasks.filter((t) => t.priority === "someday");
  const activeCount = projectTasks.filter((t) => !t.done).length;
  const activeProject = workspaceProjects.find((p) => p.id === activeProjectId);
  const selectedTask = tasks.find((t) => t.id === selectedTaskId);

  const teamStats = isTeamWorkspace
    ? workspaceMembers.filter((m) => m.status === "active").map((m) => {
        const mine = workspaceTasksRaw.filter((t) => t.assigneeId === m.id);
        return { id: m.id, name: m.name, total: mine.length, done: mine.filter((t) => t.done).length };
      }).filter((m) => m.total > 0)
    : [];

  if (!entered) return <Splash onEnter={() => setEntered(true)} />;

  return (
    <div style={{ minHeight: "100vh", background: "#ffffff", color: "#18181b", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", display: "flex", justifyContent: "center", position: "relative" }}>
      <Confetti trigger={confettiKey} />
      <AlarmBanner
        task={ringingTask}
        onDone={() => { toggleTask(ringingTask.id); setRingingTask(null); }}
        onSnooze={() => { setTasks((prev) => prev.map((t) => (t.id === ringingTask.id ? { ...t, alarmTime: Date.now() + 600000, alarmFired: false } : t))); setRingingTask(null); }}
        onDismiss={() => setRingingTask(null)}
      />

      {xpToast && (
        <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: "#18181b", color: "#fff", fontSize: 13, fontWeight: 700, padding: "8px 16px", zIndex: 60, display: "flex", alignItems: "center", gap: 6, animation: "toast-in 0.25s ease" }}>
          <Star size={13} color="#facc15" fill="#facc15" /> {xpToast}
        </div>
      )}
      {achievementToast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#18181b", color: "#fff", padding: "12px 18px", zIndex: 60, display: "flex", alignItems: "center", gap: 10, border: "1px solid #7c3aed", maxWidth: 320, animation: "toast-up 0.3s ease" }}>
          <Trophy size={18} color="#facc15" />
          <div><div style={{ fontSize: 12, fontWeight: 700 }}>{achievementToast.label}</div><div style={{ fontSize: 11, color: "#a1a1aa" }}>{achievementToast.desc}</div></div>
        </div>
      )}

      <InsightsDrawer open={insightsOpen} onClose={() => setInsightsOpen(false)} stats={stats} xp={xp} unlocked={unlocked} teamStats={teamStats} />
      <TaskDetailDrawer task={selectedTask} projects={workspaceProjects} onClose={() => setSelectedTaskId(null)} onUpdate={updateTask} onDelete={deleteTask} onFocus={setFocusPickerTask} members={workspaceMembers} isTeamWorkspace={isTeamWorkspace} googleConnected={googleConnected} />

      <SettingsScreen
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        profile={profile}
        onUpdateProfile={setProfile}
        workspace={activeWorkspace}
        isPersonal={!isTeamWorkspace}
        onInvite={inviteMember}
        onRemoveMember={removeMember}
        onChangeRole={changeRole}
        googleConnected={googleConnected}
        onToggleGoogle={() => setGoogleConnected((v) => !v)}
      />

      <DurationPicker
        task={focusPickerTask}
        onCancel={() => setFocusPickerTask(null)}
        onStart={(secs) => { setFocusSession({ task: focusPickerTask, totalSeconds: secs }); setFocusPickerTask(null); }}
      />

      {focusSession && (
        <FocusMode
          task={focusSession.task}
          totalSeconds={focusSession.totalSeconds}
          onExit={() => setFocusSession(null)}
          onComplete={() => {
            const t = tasks.find((tk) => tk.id === focusSession.task.id);
            if (t && !t.done) toggleTask(t.id);
            setFocusSession(null);
          }}
        />
      )}

      <div style={{ width: "100%", maxWidth: 480, padding: "28px 20px 60px" }}>
        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1.5px solid #18181b", paddingBottom: 16, marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Logo size={26} />
            <div>
              <h1 style={{ fontSize: 18, fontWeight: 700, margin: 0, letterSpacing: "-0.02em", lineHeight: 1.1 }}>Flow</h1>
              <span style={{ fontSize: 9, color: "#a1a1aa", fontFamily: "monospace", letterSpacing: "0.06em" }}>BY KIEVORA</span>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4, border: "1px solid #f4f4f5", borderRadius: 8, padding: "7px 9px" }}>
              <Flame size={13} color={stats.streak > 0 ? "#e11d48" : "#d4d4d8"} />
              <span style={{ fontSize: 12, fontWeight: 700 }}>{stats.streak}</span>
            </div>
            <button
              onClick={() => setInsightsOpen(true)}
              className="tappable"
              style={{ display: "flex", alignItems: "center", gap: 6, background: "#18181b", color: "#fff", border: "1px solid #18181b", borderRadius: 8, fontSize: 11, fontWeight: 700, letterSpacing: "0.03em", padding: "8px 9px 8px 11px", cursor: "pointer", boxShadow: "0 1px 3px rgba(0,0,0,0.15)" }}
            >
              <BarChart3 size={13} /> Lv {stats.level}
              <ChevronRight size={13} color="#a1a1aa" />
            </button>
            <button onClick={() => setSettingsOpen(true)} className="tappable" title="Settings" style={{ display: "flex", alignItems: "center", justifyContent: "center", background: "transparent", border: "1px solid #e4e4e7", borderRadius: 8, color: "#71717a", padding: 8, cursor: "pointer" }}>
              <SettingsIcon size={15} />
            </button>
          </div>
        </div>

        {/* Workspace switcher */}
        <WorkspaceSwitcher workspaces={workspaces} activeId={activeWorkspaceId} onSwitch={switchWorkspace} onCreate={createWorkspace} />

        {/* View-as (team workspaces only) */}
        {isTeamWorkspace && workspaceMembers.length > 1 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid #e4e4e7", borderRadius: 8, padding: "8px 10px", marginBottom: 16 }}>
            <Eye size={13} color="#a1a1aa" />
            <select value={viewAsMemberId || ""} onChange={(e) => setViewAsMemberId(e.target.value || null)} style={{ flex: 1, fontSize: 12, border: "none", outline: "none", color: "#71717a", background: "transparent" }}>
              <option value="">Admin view — see everything</option>
              {workspaceMembers.filter((m) => m.id !== "me").map((m) => (<option key={m.id} value={m.id}>View as {m.name}</option>))}
            </select>
          </div>
        )}

        {/* Project chips */}
        <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 14, paddingBottom: 2 }}>
          <button className="tappable" onClick={() => setActiveProjectId("inbox")} style={{ display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap", fontSize: 12, fontWeight: 600, padding: "7px 12px", borderRadius: 8, border: activeProjectId === "inbox" ? "1px solid #18181b" : "1px solid #e4e4e7", background: activeProjectId === "inbox" ? "#18181b" : "transparent", color: activeProjectId === "inbox" ? "#fff" : "#71717a", cursor: "pointer", flexShrink: 0 }}>
            <Folder size={12} /> Inbox
          </button>
          {workspaceProjects.map((p) => (
            <button key={p.id} className="tappable" onClick={() => setActiveProjectId(p.id)} style={{ display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap", fontSize: 12, fontWeight: 600, padding: "7px 12px", borderRadius: 8, border: activeProjectId === p.id ? "1px solid #18181b" : "1px solid #e4e4e7", background: activeProjectId === p.id ? "#18181b" : "transparent", color: activeProjectId === p.id ? "#fff" : "#71717a", cursor: "pointer", flexShrink: 0 }}>
              <Folder size={12} /> {p.name}
            </button>
          ))}
          {!newProjectOpen ? (
            <button onClick={() => setNewProjectOpen(true)} style={{ display: "flex", alignItems: "center", fontSize: 12, fontWeight: 700, padding: "7px 12px", border: "1px dashed #d4d4d8", background: "transparent", color: "#a1a1aa", cursor: "pointer", flexShrink: 0 }}><Plus size={13} /></button>
          ) : (
            <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
              <input autoFocus value={newProjectName} onChange={(e) => setNewProjectName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addProject()} placeholder="Project name" style={{ fontSize: 12, border: "1px solid #18181b", padding: "6px 8px", outline: "none", width: 120 }} />
              <button onClick={addProject} style={{ background: "#7c3aed", border: "none", color: "#fff", padding: "0 10px", cursor: "pointer" }}><Check size={13} /></button>
            </div>
          )}
        </div>

        {/* Project notes */}
        {activeProject && (
          <div style={{ marginBottom: 16, border: "1px solid #e4e4e7" }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", color: "#a1a1aa", fontFamily: "monospace", padding: "8px 10px 0" }}>PROJECT NOTES</div>
            <textarea value={activeProject.notes} onChange={(e) => updateProjectNotes(activeProject.id, e.target.value)} placeholder="Jot anything about this project here…" style={{ width: "100%", border: "none", outline: "none", resize: "none", fontSize: 13, padding: "6px 10px 10px", fontFamily: "inherit", boxSizing: "border-box", minHeight: 44 }} />
          </div>
        )}

        {/* Input card */}
        <div style={{ border: "1px solid #e4e4e7", marginBottom: 20 }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTask()} placeholder="What needs doing?" style={{ width: "100%", background: "transparent", border: "none", outline: "none", color: "#18181b", fontSize: 15, padding: "14px 14px 10px", boxSizing: "border-box", borderBottom: "1px solid #f4f4f5" }} />
          <div style={{ display: "flex" }}>
            {Object.entries(PRIORITIES).map(([key, p], i) => {
              const Icon = p.icon;
              return (
                <button key={key} onClick={() => setPriority(key)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 12, fontWeight: 600, padding: "10px 8px", border: "none", borderRight: i < 2 ? "1px solid #f4f4f5" : "none", background: priority === key ? "#18181b" : "transparent", color: priority === key ? "#fff" : "#71717a", cursor: "pointer", flex: 1 }}>
                  <Icon size={12} color={priority === key ? p.color : "#a1a1aa"} />{p.label}
                </button>
              );
            })}
          </div>
          {isTeamWorkspace && (
            <div style={{ borderTop: "1px solid #f4f4f5", padding: "9px 12px", display: "flex", alignItems: "center", gap: 6 }}>
              <Users size={13} color="#a1a1aa" />
              <select value={assigneeId} onChange={(e) => setAssigneeId(e.target.value)} style={{ flex: 1, fontSize: 12, border: "none", outline: "none", color: assigneeId ? "#18181b" : "#a1a1aa", background: "transparent" }}>
                <option value="">Everyone (workspace task)</option>
                {workspaceMembers.map((m) => (<option key={m.id} value={m.id}>Assign to {m.name}{m.id === "me" ? " (you)" : ""}</option>))}
              </select>
            </div>
          )}
          <div style={{ borderTop: "1px solid #f4f4f5" }}>
            {!alarmPickerOpen ? (
              <button onClick={() => setAlarmPickerOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", border: "none", background: "transparent", padding: "9px 12px", fontSize: 12, color: alarmTime ? "#7c3aed" : "#a1a1aa", cursor: "pointer", fontWeight: alarmTime ? 700 : 400 }}>
                <Clock size={13} />{alarmTime ? `Alarm: ${formatAlarm(alarmTime)}` : "Set a reminder time (optional)"}
              </button>
            ) : (
              <div style={{ padding: "10px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
                {googleConnected && (
                  <div style={{ display: "flex", border: "1px solid #e4e4e7" }}>
                    <button onClick={() => setReminderProvider("default")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 11, fontWeight: 700, padding: "7px 6px", border: "none", borderRight: "1px solid #e4e4e7", background: reminderProvider === "default" ? "#18181b" : "transparent", color: reminderProvider === "default" ? "#fff" : "#71717a", cursor: "pointer" }}>
                      <Bell size={11} /> Flow
                    </button>
                    <button onClick={() => setReminderProvider("google")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 11, fontWeight: 700, padding: "7px 6px", border: "none", background: reminderProvider === "google" ? "#18181b" : "transparent", color: reminderProvider === "google" ? "#fff" : "#71717a", cursor: "pointer" }}>
                      <CalendarDays size={11} /> Google Calendar
                    </button>
                  </div>
                )}
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  <button onClick={() => setQuickAlarm(60)} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>In 1h</button>
                  <button onClick={() => setQuickAlarm(180)} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>In 3h</button>
                  <button onClick={setTonightAlarm} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>Tonight 8pm</button>
                  <button onClick={setTomorrowAlarm} style={{ fontSize: 11, fontWeight: 600, padding: "6px 10px", border: "1px solid #e4e4e7", background: "transparent", cursor: "pointer" }}>Tmrw 9am</button>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input type="datetime-local" value={customTime} onChange={(e) => { setCustomTime(e.target.value); setAlarmTime(new Date(e.target.value).getTime()); }} style={{ flex: 1, fontSize: 12, border: "1px solid #e4e4e7", padding: "6px 8px" }} />
                  {alarmTime && <button onClick={() => { setAlarmTime(null); setCustomTime(""); }} style={{ fontSize: 11, color: "#e11d48", background: "transparent", border: "1px solid #e4e4e7", padding: "0 10px", cursor: "pointer" }}>Clear</button>}
                  <button onClick={() => setAlarmPickerOpen(false)} style={{ fontSize: 11, background: "#18181b", color: "#fff", border: "none", padding: "0 10px", cursor: "pointer" }}>OK</button>
                </div>
              </div>
            )}
          </div>
          <button className="tappable" onClick={addTask} style={{ width: "100%", border: "none", borderTop: "1px solid #e4e4e7", background: "#7c3aed", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer", padding: "11px 0", fontSize: 13, fontWeight: 700 }}>
            <Plus size={15} /> Add task
          </button>
        </div>

        {/* Filter tabs */}
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, borderBottom: "1px solid #f4f4f5" }}>
          <div style={{ display: "flex" }}>
            {["active", "done", "all"].map((f) => (
              <button key={f} onClick={() => setFilter(f)} style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", padding: "8px 14px", border: "none", borderBottom: filter === f ? "2px solid #18181b" : "2px solid transparent", marginBottom: -1, background: "transparent", color: filter === f ? "#18181b" : "#a1a1aa", cursor: "pointer" }}>{f}</button>
            ))}
          </div>
          <span style={{ fontSize: 11, fontFamily: "monospace", color: "#a1a1aa", alignSelf: "center" }}>{activeCount} open</span>
        </div>

        {/* Task list */}
        <div style={{ display: "flex", flexDirection: "column" }}>
          {!loaded && <p style={{ color: "#a1a1aa", fontSize: 13 }}>Loading…</p>}
          {loaded && mainTasks.length === 0 && somedayTasks.length === 0 && (
            <div style={{ textAlign: "center", padding: "48px 12px", color: "#a1a1aa", fontSize: 13, border: "1px dashed #e4e4e7" }}>Nothing here. Add a task above — tap it after to add subtasks, notes, tags, and more.</div>
          )}
          {mainTasks.map((t) => (
            <TaskRow key={t.id} t={t} onToggle={toggleTask} onDelete={deleteTask} onOpen={setSelectedTaskId} onFocus={setFocusPickerTask} popped={poppedId === t.id} showAssignee={isTeamWorkspace} assigneeMember={workspaceMembers.find((m) => m.id === t.assigneeId)} />
          ))}
        </div>

        {somedayTasks.length > 0 && (
          <div style={{ marginTop: 12 }}>
            <button onClick={() => setSomedayOpen(!somedayOpen)} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", background: "transparent", border: "none", borderTop: "1px solid #f4f4f5", padding: "12px 4px", cursor: "pointer", color: "#71717a" }}>
              {somedayOpen ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
              <Moon size={13} /><span style={{ fontSize: 12, fontWeight: 700 }}>Someday</span>
              <span style={{ fontSize: 11, fontFamily: "monospace", marginLeft: "auto" }}>{somedayTasks.length}</span>
            </button>
            {somedayOpen && somedayTasks.map((t) => (
              <TaskRow key={t.id} t={t} onToggle={toggleTask} onDelete={deleteTask} onOpen={setSelectedTaskId} onFocus={setFocusPickerTask} popped={poppedId === t.id} showAssignee={isTeamWorkspace} assigneeMember={workspaceMembers.find((m) => m.id === t.assigneeId)} />
            ))}
          </div>
        )}
      </div>

      <style>{`
        @keyframes confetti-fall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(120px) rotate(200deg); } }
        @keyframes task-in { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes toast-in { 0% { opacity: 0; transform: translate(-50%, -8px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes toast-up { 0% { opacity: 0; transform: translate(-50%, 12px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        .tappable { transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .tappable:active { transform: scale(0.97); }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TaskTracker />);
</script>
</body>
</html>
